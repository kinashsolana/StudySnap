<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>StudySnap</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">STUDYSNAP</p>
        <h1>Your school, organized.</h1>
        <p class="sub">Keep assignments and exams in one simple place.</p>
      </div>
      <button id="installBtn" class="secondary hidden">Install</button>
    </header>

    <section class="card">
      <h2>Add an assignment</h2>
      <form id="taskForm">
        <label>Assignment name
          <input id="name" required maxlength="80" placeholder="e.g. Math chapter 4">
        </label>
        <label>Due date
          <input id="date" type="date" required>
        </label>
        <label>Difficulty
          <select id="difficulty">
            <option>Easy</option>
            <option selected>Medium</option>
            <option>Hard</option>
          </select>
        </label>
        <button class="primary" type="submit">Add assignment</button>
      </form>
    </section>

    <section>
      <div class="section-title">
        <h2>Upcoming</h2>
        <span id="count"></span>
      </div>
      <div id="tasks" class="tasks"></div>
      <p id="empty" class="empty">No assignments yet. Add your first one above.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
